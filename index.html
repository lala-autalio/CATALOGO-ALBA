
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ALBA Fashion | Catálogo</title>

    <!-- Conexion con CSS -->
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- ENCABEZADO -->

    <header class="encabezado">

        <h1>CATÁLOGO MAYORISTA</h1>

        <img
            src="imagenes/logo.jpeg"
            alt="Logo original de ALBA Fashion"
            class="logo"
        >

        <p>MODA FEMENINA · ESTILO · ELEGANCIA</p>

    </header>


    <main>

        <!-- BUSCADOR -->

        <section class="busqueda">

            <div class="buscador-contenedor">

                <span class="icono-busqueda">⌕</span>

                <input
                    type="text"
                    id="buscar"
                    placeholder="¿Qué prenda estás buscando?"
                >

                <button id="limpiar-busqueda" type="button">
                    ✕
                </button>

            </div>

        </section>


        <!-- CATEGORIAS -->

        <section class="categorias">

            <h2>MATERIALES</h2>

            <div class="botones-categorias">

                <button class="categoria activa"
                        data-categoria="TODOS">
                    TODOS
                </button>

                <button class="categoria"
                        data-categoria="PAÑOS">
                    PAÑOS
                </button>

                <button class="categoria"
                        data-categoria="GAMUZADOS">
                    GAMUZADOS
                </button>

                <button class="categoria"
                        data-categoria="JEANS">
                    JEANS
                </button>

                <button class="categoria"
                        data-categoria="CUEROS">
                    CUEROS
                </button>
                <button class="categoria"
                        data-categoria="BLAZER">
                    BLAZER
                </button>
                <button class="categoria"
                        data-categoria="FRISADOS">
                    FRISADOS
                </button>

            </div>

        </section>


        <!-- PRODUCTOS -->

        <section class="productos">

            <div class="titulo-productos">

                <div>

                    <h2>Nuestra colección</h2>

                    <p class="subtitulo">
                        Preciona la imagen de la prenda que te interesa (colores disponibles)
                    </p>

                </div>

            </div>

            <div id="lista-productos" class="lista-productos">
            </div>

        </section>

    </main>

    <!-- VENTANA DE DETALLES DEL PRODUCTO -->

    <div id="modal-producto" class="modal">

        <div class="modal-contenido">

            <button
                id="cerrar-modal"
                class="cerrar-modal"
                type="button">

                &times;

            </button>

            <h2 id="titulo-modal"></h2>
            <p class="texto-modal">
                Colores disponibles
            </p>
            <!--FOTO CON TODOS LOS COLORES -->
            <div id="galeria-colores"></div>

            <h3 id="precio-modal"></h3>

            <p id="tallas-modal" class="tallas-modal"></p>

        </div>

    </div>


    <!-- BOTONES FLOTANTES DE WHATSAPP -->

    <div class="whatsapp-container">


        <!-- MAYORISTA -->

        <a
            class="whatsapp mayorista"
            href="https://wa.me/59169434591?text=Hola%2C%20quisiera%20informacion%20sobre%20compras%20mayoristas."
            target="_blank"
            rel="noopener noreferrer">

            <span>Mayorista</span>

            <b>

                <svg viewBox="0 0 32 32"
                     width="29"
                     height="29"
                     fill="white"
                     aria-hidden="true">

                    <path d="M16 3C8.83 3 3 8.83 3 16c0 2.28.59 4.43 1.63 6.3L3 29l6.87-1.6A12.93 12.93 0 0 0 16 29c7.17 0 13-5.83 13-13S23.17 3 16 3zm0 23.7c-2.03 0-4.01-.55-5.73-1.59l-.41-.24-4.07.95.97-3.97-.27-.42A10.65 10.65 0 0 1 5.7 16C5.7 10.32 10.32 5.7 16 5.7S26.3 10.32 26.3 16 21.68 26.7 16 26.7zm5.85-7.98c-.32-.16-1.9-.94-2.19-1.05-.3-.11-.51-.16-.72.16-.21.32-.83 1.05-1.02 1.27-.19.21-.38.24-.7.08-.32-.16-1.36-.5-2.59-1.6-.96-.85-1.61-1.9-1.8-2.22-.19-.32-.02-.49.14-.65.14-.14.32-.38.48-.56.16-.19.21-.32.32-.53.11-.21.05-.4-.03-.56-.08-.16-.72-1.74-.99-2.38-.26-.62-.52-.53-.72-.54h-.61c-.21 0-.56.08-.85.4-.29.32-1.12 1.1-1.12 2.67s1.15 3.1 1.31 3.31c.16.21 2.26 3.45 5.48 4.84.77.33 1.37.53 1.84.68.77.24 1.47.21 2.02.13.62-.09 1.9-.78 2.17-1.53.27-.75.27-1.4.19-1.53-.08-.13-.29-.21-.61-.37z"/>

                </svg>

            </b>

        </a>

    </div>


    <!-- PIE DE PAGINA -->

    <footer>

        <h3>ALBA Fashion</h3>

        <p>Moda femenina para cada ocasión ♡</p>

        <p class="derechos">
            © 2026 ALBA Fashion - Todos los derechos reservados
        </p>

    </footer>


    <!-- Conexion con JavaScript -->

    <script src="script.js"></script>

</body>

</html>
